[workspace]
authors = ["JesusRodVil <jesusrodriguezvllr@gmail.com>"]
channels = ['conda-forge']
name = "sombras-punto"
platforms = ['linux-64']
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
pvlib = ">=0.16.1,<0.17"
pandas = ">=3.1.1,<4"
rasterio = ">=1.5.2,<2"
pyproj = ">=3.8.0,<4"

[feature.test.dependencies]
pytest = "*"

[feature.test.tasks]
test = "pytest"

[feature.dev.dependencies]
matplotlib = "*"
ipython = "*"

[environments]
test = ["test"]
dev = ["dev", "test"]
